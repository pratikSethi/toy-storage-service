name: ci

on:
  push:
  pull_request:

# The demo target is Linux arm64, but CI runs on whatever ubuntu-latest offers (x64 today).
# Add an ubuntu-24.04-arm runner to the cpp matrix when arm64 specific issues matter.

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync and lint (skipped until cli/ and tests/ exist)
        run: |
          if [ -f cli/pyproject.toml ]; then uv sync --project cli; fi
          dirs=""
          for d in cli tests; do [ -d "$d" ] && dirs="$dirs $d"; done
          if [ -n "$dirs" ]; then uvx ruff check $dirs; else echo "no python directories yet"; fi

  cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [chunk-store, object-index]
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/vcpkg.json', matrix.service)) }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - run: mkdir -p .vcpkg-cache
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        working-directory: ${{ matrix.service }}
        run: cmake --preset debug
      - name: Build
        working-directory: ${{ matrix.service }}
        run: cmake --build --preset debug
      - name: Test
        working-directory: ${{ matrix.service }}
        run: ctest --preset debug
