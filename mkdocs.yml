      - 0003 Random chunk ids: adr/0003-random-chunk-ids-not-content-addressed.md
      - 0004 Cells for the data plane: adr/0004-cells-for-the-data-plane-thin-global-layer.md
      - 0005 File-reload config: adr/0005-file-reload-config-before-config-service.md
      - 0006 Object bytes through FrontdoorService: adr/0006-object-bytes-through-frontdoor.md
      - 0007 Multi-word service names: adr/0007-multi-word-service-names.md
  - Reviews:
