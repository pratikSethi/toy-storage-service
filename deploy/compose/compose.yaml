services:
  frontdoor:
    build:
      context: ../..
      dockerfile: frontdoor/Dockerfile
    platform: linux/arm64
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - ts2-data:/data
      - ../../config/frontdoor.compose.yaml:/etc/ts2/frontdoor.yaml:ro
    environment:
      # Remote mode: gRPC to the two services below. Unset both for the in-process backends.
      TS2_INDEX_ADDR: object-index:50052
      TS2_CHUNK_NODES: node-1=chunk-store:50051
      # Frontdoor refuses to start unless TS2_GC_MIN_AGE_SECS is at least twice TS2_PUT_TIMEOUT_SECS.
      TS2_PUT_TIMEOUT_SECS: ${TS2_PUT_TIMEOUT_SECS:-900}
      TS2_GC_MIN_AGE_SECS: ${TS2_GC_MIN_AGE_SECS:-3600}
      TS2_GC_INTERVAL_SECS: ${TS2_GC_INTERVAL_SECS:-600}
      # Empty keeps the OTLP exporter off; `make up-obs` sets it.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TS2_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ts2-frontdoor
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      chunk-store: {condition: service_healthy}
      object-index: {condition: service_healthy}

  # The two gRPC services publish no host port; only frontdoor talks to them (review 002).
  chunk-store:
    build:
      context: ../..
      dockerfile: chunk-store/Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - chunk-data:/data
    healthcheck:
      # The image has no curl or grpc_health_probe; perl-base is there, and a TCP connect to the listener is enough.
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "IO::Socket::INET->new('127.0.0.1:50051') or exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  object-index:
    build:
      context: ../..
      dockerfile: object-index/Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - index-data:/data
    healthcheck:
      # The image has no curl or grpc_health_probe; perl-base is there, and a TCP connect to the listener is enough.
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "IO::Socket::INET->new('127.0.0.1:50052') or exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.165.0
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [victoriametrics, victorialogs]

  victoriametrics:
    profiles: [obs]
    image: victoriametrics/victoria-metrics:v1.156.0
    command: ["-storageDataPath=/storage", "-retentionPeriod=7d"]
    volumes:
      - vm-data:/storage

  victorialogs:
    profiles: [obs]
    image: victoriametrics/victoria-logs:v1.54.0
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=7d"]
    volumes:
      - vl-data:/vlogs

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local only: admin/admin plus anonymous viewer.
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [victoriametrics, victorialogs]

volumes:
  ts2-data:
  chunk-data:
  index-data:
  vm-data:
  vl-data:
  grafana-data:
