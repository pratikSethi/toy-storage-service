services:
  frontdoor:
    build:
      context: ../..
      dockerfile: frontdoor/Dockerfile
    platform: linux/arm64
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ts2-data:/data
      - ../../config/frontdoor.compose.yaml:/etc/ts2/frontdoor.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  ts2-data:
